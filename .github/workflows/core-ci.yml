name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Build and verify core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build learning core
        run: dotnet build src/Ravi.Core/Ravi.Core.csproj --configuration Release

      - name: Run core checks
        run: dotnet run --project tests/Ravi.Core.Tests/Ravi.Core.Tests.csproj --configuration Release
